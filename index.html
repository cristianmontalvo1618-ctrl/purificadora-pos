<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purificadora POS - Sistema de Venta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">

  <!-- Header Turquesa Original -->
  <header class="bg-[#00838f] text-white px-6 py-3 shadow-md flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="bg-teal-100/30 p-2 rounded-full">
        <span class="text-2xl">💧</span>
      </div>
      <div>
        <h1 class="text-xl font-bold leading-tight">Purificadora POS</h1>
        <p class="text-xs text-teal-100 opacity-90">Sistemas & Equipos de Purificación</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="focarScanner()" class="bg-[#00acc1] hover:bg-[#00bcd4] text-white text-xs font-bold py-2 px-4 rounded-lg flex items-center gap-2 shadow-sm transition">
        <span>|||||</span> Escanear Código
      </button>
      <a href="admin.html" class="bg-teal-900/40 hover:bg-teal-900/60 text-white text-xs font-bold py-2 px-3 rounded-lg transition">⚙️ Admin</a>
    </div>
  </header>

  <!-- Layout Principal -->
  <main class="p-6 flex-1 max-w-[1600px] mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- Columna Izquierda: Buscador + Catálogo de Productos en Tarjetas -->
    <section class="lg:col-span-2 flex flex-col gap-6">
      
      <!-- Buscador principal -->
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
          🔍
        </span>
        <input type="text" id="barcodeInput" oninput="filtrarProductos()" placeholder="Buscar filtro, resina, garrafón, membrana o código..." class="w-full bg-white border-0 shadow-sm rounded-xl py-3.5 pl-11 pr-4 text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-600 text-sm" autofocus>
      </div>

      <!-- Tarjetero / Cuadrícula de Productos -->
      <div id="gridProductos" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
        <div class="col-span-full text-center text-slate-400 py-10">Cargando catálogo...</div>
      </div>
    </section>

    <!-- Columna Derecha: Orden Actual -->
    <section class="bg-white rounded-2xl shadow-sm p-6 flex flex-col justify-between border border-slate-100">
      <div>
        <!-- Encabezado Carrito -->
        <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-4">
          <div class="flex items-center gap-2 text-slate-800 font-bold text-lg">
            <span class="text-teal-600">🛒</span> Orden Actual
          </div>
          <button onclick="vaciarCarrito()" class="text-rose-400 hover:text-rose-600 text-xs font-semibold">Vaciar</button>
        </div>

        <!-- Lista de Productos en la Orden -->
        <div id="carritoContenedor" class="min-h-[180px] max-h-[320px] overflow-y-auto pr-1 space-y-3 mb-6">
          <p id="carritoVacioMsg" class="text-slate-300 text-center py-16 text-sm font-medium">Aún no hay productos añadidos</p>
          <div id="carritoItems" class="space-y-3"></div>
        </div>

        <!-- Total a pagar -->
        <div class="flex justify-between items-center border-t border-slate-100 pt-4 mb-6">
          <span class="text-slate-500 font-semibold text-sm">Total a pagar:</span>
          <span class="text-2xl font-black text-[#00838f]" id="totalVenta">$0.00</span>
        </div>

        <!-- PAGO Y MÉTODOS -->
        <div class="space-y-4">
          <span class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">SELECCIONE MÉTODO DE PAGO:</span>

          <!-- Botones de Método de Pago Originales -->
          <div class="grid grid-cols-3 gap-2">
            <button id="btnEfectivo" onclick="seleccionarMetodo('Efectivo')" class="flex flex-col items-center justify-center py-3 px-2 rounded-xl text-white font-bold text-xs bg-[#00897b] shadow-md transition transform active:scale-95">
              <span class="text-base mb-1">💵</span> Efectivo
            </button>
            <button id="btnTransferencia" onclick="seleccionarMetodo('Transferencia')" class="flex flex-col items-center justify-center py-3 px-2 rounded-xl text-white font-bold text-xs bg-[#0288d1] opacity-60 hover:opacity-100 transition transform active:scale-95">
              <span class="text-base mb-1">🏛️</span> Transferencia
            </button>
            <button id="btnCredito" onclick="seleccionarMetodo('Credito')" class="flex flex-col items-center justify-center py-3 px-2 rounded-xl text-white font-bold text-xs bg-[#e65100] opacity-60 hover:opacity-100 transition transform active:scale-95">
              <span class="text-base mb-1">📅</span> A Plazo
            </button>
          </div>

          <!-- Despliegue Pago en Efectivo (Billetes + Cambio) -->
          <div id="despliegueEfectivo" class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-3">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-slate-500 w-24">Paga con ($):</span>
              <input type="number" id="montoRecibido" oninput="calcularCambio()" placeholder="0.00" class="flex-1 border border-slate-300 p-2 rounded-lg text-sm font-bold text-slate-800 focus:outline-teal-600">
            </div>
            <div class="grid grid-cols-4 gap-1.5 text-xs">
              <button onclick="pagoRapido(20)" class="bg-white border hover:bg-slate-100 py-1 rounded font-bold text-slate-700 shadow-sm">$20</button>
              <button onclick="pagoRapido(50)" class="bg-white border hover:bg-slate-100 py-1 rounded font-bold text-slate-700 shadow-sm">$50</button>
              <button onclick="pagoRapido(100)" class="bg-white border hover:bg-slate-100 py-1 rounded font-bold text-slate-700 shadow-sm">$100</button>
              <button onclick="pagoRapido(200)" class="bg-white border hover:bg-slate-100 py-1 rounded font-bold text-slate-700 shadow-sm">$200</button>
            </div>
            <div class="flex justify-between items-center pt-1 border-t border-slate-200 text-xs">
              <span class="font-bold text-slate-600">Cambio a entregar:</span>
              <span class="font-black text-emerald-600 text-base" id="montoCambio">$0.00</span>
            </div>
          </div>

          <!-- Despliegue Pago A Plazo / Crédito -->
          <div id="despliegueCredito" class="hidden bg-amber-50 p-3.5 rounded-xl border border-amber-200 space-y-2.5">
            <input type="text" id="clienteNombre" placeholder="Nombre del Cliente" class="w-full border border-amber-300 p-2 rounded-lg text-xs">
            <input type="tel" id="clienteTel" placeholder="Teléfono" class="w-full border border-amber-300 p-2 rounded-lg text-xs">
            <div class="flex items-center gap-2">
              <span class="text-[11px] font-bold text-amber-800 w-28">Fecha Límite:</span>
              <input type="date" id="fechaLimite" class="flex-1 border border-amber-300 p-1.5 rounded-lg text-xs">
            </div>
          </div>
        </div>
      </div>

      <!-- Botón de Cobrar -->
      <button onclick="procesarVenta()" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-base shadow-md transition transform active:scale-95">
        ✅ Procesar Venta
      </button>
    </section>

  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCrkP1I6pplC-Qk02QhPxSiXK-0ZkEwEkQ",
      authDomain: "purificadorapos.firebaseapp.com",
      projectId: "purificadorapos",
      storageBucket: "purificadorapos.firebasestorage.app",
      messagingSenderId: "484666109632",
      appId: "1:484666109632:web:fb6698a3e11c19f6dec725"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let productosCatalogo = [];
    let carrito = [];
    let metodoSeleccionado = "Efectivo";

    const barcodeInput = document.getElementById("barcodeInput");

    // Mantener Foco Automático para el Escáner sin clics
    function focarScanner() {
      barcodeInput.focus();
    }

    document.addEventListener("click", (e) => {
      if (e.target.tagName !== "INPUT" && e.target.tagName !== "SELECT" && e.target.tagName !== "BUTTON") {
        focarScanner();
      }
    });

    barcodeInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        buscarYAgregarPorCodigo();
      }
    });

    // Cargar Catálogo desde Firestore y renderizarlo en tarjetas
    db.collection("productos").onSnapshot(snap => {
      productosCatalogo = [];
      snap.forEach(doc => {
        productosCatalogo.push({ id: doc.id, ...doc.data() });
      });
      renderizarGrid(productosCatalogo);
    });

    function getBadgeColorClass(categoria) {
      const cat = (categoria || '').toLowerCase();
      if (cat.includes('filtro')) return 'bg-emerald-100 text-emerald-700';
      if (cat.includes('envase') || cat.includes('garraf')) return 'bg-cyan-100 text-cyan-700';
      if (cat.includes('insumo') || cat.includes('sal')) return 'bg-indigo-100 text-indigo-700';
      if (cat.includes('equipo') || cat.includes('membrana')) return 'bg-purple-100 text-purple-700';
      return 'bg-slate-100 text-slate-600';
    }

    function renderizarGrid(lista) {
      const grid = document.getElementById("gridProductos");
      grid.innerHTML = "";

      if (lista.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center text-slate-400 py-10">No hay productos registrados en el catálogo.</div>`;
        return;
      }

      lista.forEach(p => {
        const colorBadge = getBadgeColorClass(p.categoria);
        grid.innerHTML += `
          <div onclick="agregarAlCarrito('${p.id}')" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex flex-col justify-between hover:shadow-md transition cursor-pointer group">
            <div>
              <span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-bold ${colorBadge} mb-2">
                ${p.categoria || 'General'}
              </span>
              <h3 class="font-bold text-slate-800 text-base group-hover:text-teal-700 transition">${p.nombre}</h3>
              <p class="text-xs text-slate-400 font-mono mt-0.5">Cod: ${p.codigo}</p>
            </div>
            <div class="flex justify-between items-center mt-4">
              <span class="text-lg font-black text-[#00838f]">$${parseFloat(p.precio).toFixed(2)}</span>
              <button onclick="event.stopPropagation(); agregarAlCarrito('${p.id}')" class="bg-slate-100 group-hover:bg-teal-600 group-hover:text-white text-slate-600 w-8 h-8 rounded-lg flex items-center justify-center font-bold text-lg transition shadow-sm">
                +
              </button>
            </div>
          </div>
        `;
      });
    }

    function filtrarProductos() {
      const query = barcodeInput.value.trim().toLowerCase();
      const filtrados = productosCatalogo.filter(p => 
        (p.nombre && p.nombre.toLowerCase().includes(query)) ||
        (p.codigo && p.codigo.toLowerCase().includes(query)) ||
        (p.categoria && p.categoria.toLowerCase().includes(query))
      );
      renderizarGrid(filtrados);
    }

    function buscarYAgregarPorCodigo() {
      const codigo = barcodeInput.value.trim();
      if (!codigo) return;

      const prod = productosCatalogo.find(p => p.codigo === codigo);
      if (prod) {
        agregarAlCarrito(prod.id);
      } else {
        alert("Producto no encontrado en el catálogo.");
      }
      barcodeInput.value = "";
      filtrarProductos();
      focarScanner();
    }

    function agregarAlCarrito(id) {
      const prod = productosCatalogo.find(p => p.id === id);
      if (!prod) return;

      const idx = carrito.findIndex(i => i.id === id);
      if (idx > -1) {
        carrito[idx].cant++;
      } else {
        carrito.push({ ...prod, cant: 1 });
      }
      renderizarCarrito();
    }

    function renderizarCarrito() {
      const itemsDiv = document.getElementById("carritoItems");
      const vacioMsg = document.getElementById("carritoVacioMsg");
      itemsDiv.innerHTML = "";

      if (carrito.length === 0) {
        vacioMsg.classList.remove("hidden");
      } else {
        vacioMsg.classList.add("hidden");
      }

      let total = 0;
      carrito.forEach((p, idx) => {
        const subtotal = p.precio * p.cant;
        total += subtotal;

        itemsDiv.innerHTML += `
          <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-xs">
            <div class="flex-1 pr-2">
              <p class="font-bold text-slate-700">${p.nombre}</p>
              <p class="text-slate-400">$${parseFloat(p.precio).toFixed(2)} c/u</p>
            </div>
            <div class="flex items-center gap-2">
              <span class="font-bold text-slate-800 bg-white px-2 py-0.5 rounded border">x${p.cant}</span>
              <span class="font-black text-teal-700 w-16 text-right">$${subtotal.toFixed(2)}</span>
              <button onclick="eliminarItem(${idx})" class="text-rose-400 hover:text-rose-600 font-bold px-1">✕</button>
            </div>
          </div>
        `;
      });

      document.getElementById("totalVenta").innerText = `$${total.toFixed(2)}`;
      calcularCambio();
    }

    function eliminarItem(idx) {
      carrito.splice(idx, 1);
      renderizarCarrito();
    }

    function vaciarCarrito() {
      carrito = [];
      renderizarCarrito();
    }

    function seleccionarMetodo(metodo) {
      metodoSeleccionado = metodo;
      
      const btnE = document.getElementById("btnEfectivo");
      const btnT = document.getElementById("btnTransferencia");
      const btnC = document.getElementById("btnCredito");

      btnE.classList.toggle("opacity-60", metodo !== 'Efectivo');
      btnT.classList.toggle("opacity-60", metodo !== 'Transferencia');
      btnC.classList.toggle("opacity-60", metodo !== 'Credito');

      document.getElementById("despliegueEfectivo").classList.toggle("hidden", metodo !== 'Efectivo');
      document.getElementById("despliegueCredito").classList.toggle("hidden", metodo !== 'Credito');
    }

    function obtenerTotal() {
      return carrito.reduce((s, i) => s + (i.precio * i.cant), 0);
    }

    function calcularCambio() {
      const total = obtenerTotal();
      const recibido = parseFloat(document.getElementById("montoRecibido").value) || 0;
      const cambio = recibido - total;
      document.getElementById("montoCambio").innerText = `$${(cambio > 0 ? cambio : 0).toFixed(2)}`;
    }

    function pagoRapido(monto) {
      document.getElementById("montoRecibido").value = monto;
      calcularCambio();
    }

    async function procesarVenta() {
      if (carrito.length === 0) return alert("Añade al menos un producto a la orden.");

      const total = obtenerTotal();
      const recibido = parseFloat(document.getElementById("montoRecibido").value) || 0;

      if (metodoSeleccionado === "Efectivo" && recibido < total) {
        return alert("El dinero recibido es menor al total a pagar.");
      }

      const venta = {
        fecha: new Date().toISOString(),
        items: carrito,
        total: total,
        metodoPago: metodoSeleccionado,
        pagoCon: metodoSeleccionado === "Efectivo" ? recibido : total,
        cambio: metodoSeleccionado === "Efectivo" ? Math.max(0, recibido - total) : 0,
        estado: metodoSeleccionado === "Credito" ? "Pendiente" : "Pagado"
      };

      if (metodoSeleccionado === "Credito") {
        const cliente = document.getElementById("clienteNombre").value.trim();
        const tel = document.getElementById("clienteTel").value.trim();
        const fechaLimite = document.getElementById("fechaLimite").value;

        if (!cliente || !fechaLimite) {
          return alert("Para ventas a plazo debes ingresar el nombre del cliente y la fecha límite de pago.");
        }

        venta.cliente = cliente;
        venta.telefono = tel;
        venta.fechaLimite = fechaLimite;
      }

      // Guardar Venta
      await db.collection("ventas").add(venta);

      // Descontar Inventario
      for (let item of carrito) {
        const ref = db.collection("productos").doc(item.id);
        const doc = await ref.get();
        if (doc.exists) {
          const nuevoStock = Math.max(0, (doc.data().stock || 0) - item.cant);
          await ref.update({ stock: nuevoStock });
        }
      }

      alert(`¡Venta procesada con éxito!\nCambio: $${venta.cambio.toFixed(2)}`);
      carrito = [];
      document.getElementById("montoRecibido").value = "";
      renderizarCarrito();
      focarScanner();
    }
  </script>
</body>
</html>
