<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Purificadora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">
  <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold">⚙️ Panel de Administración</h1>
    <a href="index.html" class="bg-teal-600 hover:bg-teal-700 text-white text-sm py-2 px-4 rounded-lg font-semibold transition">Ir a Caja / POS 🛒</a>
  </header>

  <main class="p-6 max-w-7xl mx-auto w-full space-y-8">
    <!-- Inventario y Registro -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="font-bold text-lg mb-4 text-slate-700">Registrar Producto</h2>
        <form id="formProducto" onsubmit="guardarProducto(event)" class="space-y-3">
          <input type="text" id="prodCodigo" placeholder="Código de Barras / QR" class="w-full border border-slate-300 p-3 rounded-xl text-sm focus:ring-2 focus:ring-slate-800 outline-none" required>
          <input type="text" id="prodNombre" placeholder="Nombre del Producto" class="w-full border border-slate-300 p-3 rounded-xl text-sm focus:ring-2 focus:ring-slate-800 outline-none" required>
          <input type="text" id="prodCategoria" placeholder="Categoría (Ej. Garrafones)" class="w-full border border-slate-300 p-3 rounded-xl text-sm focus:ring-2 focus:ring-slate-800 outline-none" required>
          <div class="grid grid-cols-2 gap-3">
            <input type="number" step="0.01" id="prodPrecio" placeholder="Precio ($)" class="border border-slate-300 p-3 rounded-xl text-sm focus:ring-2 focus:ring-slate-800 outline-none" required>
            <input type="number" id="prodStock" placeholder="Stock" class="border border-slate-300 p-3 rounded-xl text-sm focus:ring-2 focus:ring-slate-800 outline-none" required>
          </div>
          <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition shadow">Guardar Producto</button>
        </form>
      </section>

      <section class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
        <h2 class="font-bold text-lg mb-4 text-slate-700">Inventario Registrado</h2>
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b text-xs text-slate-400 uppercase tracking-wider">
              <th class="p-3">Código</th>
              <th class="p-3">Producto</th>
              <th class="p-3">Categoría</th>
              <th class="p-3">Precio</th>
              <th class="p-3">Stock</th>
            </tr>
          </thead>
          <tbody id="tablaInventario"></tbody>
        </table>
      </section>
    </div>

    <!-- Cuentas por Cobrar (Crédito) -->
    <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
      <h2 class="font-bold text-lg mb-4 text-amber-700">⏳ Cuentas por Cobrar / Ventas a Plazo</h2>
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b text-xs text-slate-400 uppercase tracking-wider">
            <th class="p-3">Cliente</th>
            <th class="p-3">Teléfono</th>
            <th class="p-3">Total Deuda</th>
            <th class="p-3">Fecha Límite</th>
            <th class="p-3">Estado</th>
            <th class="p-3">Acción</th>
          </tr>
        </thead>
        <tbody id="tablaCreditos"></tbody>
      </table>
    </section>

    <!-- Historial de Ventas y Excel -->
    <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-bold text-lg text-emerald-800">📊 Historial de Ventas</h2>
        <button onclick="exportarExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm px-4 py-2 rounded-xl transition shadow">
          📥 Exportar a Excel (CSV)
        </button>
      </div>
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b text-xs text-slate-400 uppercase tracking-wider">
            <th class="p-3">Fecha / Hora</th>
            <th class="p-3">Método</th>
            <th class="p-3">Total</th>
            <th class="p-3">Estado</th>
          </tr>
        </thead>
        <tbody id="tablaVentas"></tbody>
      </table>
    </section>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCrkP1I6pplC-Qk02QhPxSiXK-0ZkEwEkQ",
      authDomain: "purificadorapos.firebaseapp.com",
      projectId: "purificadorapos",
      storageBucket: "purificadorapos.firebasestorage.app",
      messagingSenderId: "484666109632",
      appId: "1:484666109632:web:fb6698a3e11c19f6dec725"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let ventasGlobales = [];

    db.collection("productos").onSnapshot(snap => {
      const tbody = document.getElementById("tablaInventario");
      tbody.innerHTML = "";
      snap.forEach(doc => {
        const p = doc.data();
        tbody.innerHTML += `
          <tr class="border-b border-slate-100 hover:bg-slate-50">
            <td class="p-3 text-sm">${p.codigo}</td>
            <td class="p-3 font-semibold text-slate-700">${p.nombre}</td>
            <td class="p-3 text-slate-500">${p.categoria}</td>
            <td class="p-3 text-slate-700">$${parseFloat(p.precio).toFixed(2)}</td>
            <td class="p-3 font-bold ${p.stock < 5 ? 'text-rose-600' : 'text-emerald-600'}">${p.stock}</td>
          </tr>
        `;
      });
    });

    db.collection("ventas").where("metodoPago", "==", "Credito").onSnapshot(snap => {
      const tbody = document.getElementById("tablaCreditos");
      tbody.innerHTML = "";
      snap.forEach(doc => {
        const v = doc.data();
        tbody.innerHTML += `
          <tr class="border-b border-slate-100 hover:bg-slate-50">
            <td class="p-3 font-semibold text-slate-700">${v.cliente || 'N/A'}</td>
            <td class="p-3 text-slate-500">${v.telefono || 'N/A'}</td>
            <td class="p-3 font-bold text-amber-700">$${parseFloat(v.total).toFixed(2)}</td>
            <td class="p-3 text-sm">${v.fechaLimite || 'N/A'}</td>
            <td class="p-3"><span class="px-2.5 py-1 rounded-full text-xs font-bold ${v.estado === 'Pagado' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${v.estado}</span></td>
            <td class="p-3">
              ${v.estado !== 'Pagado' ? `<button onclick="marcarPagado('${doc.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition">Marcar Pagado</button>` : '---'}
            </td>
          </tr>
        `;
      });
    });

    db.collection("ventas").onSnapshot(snap => {
      const tbody = document.getElementById("tablaVentas");
      tbody.innerHTML = "";
      ventasGlobales = [];
      snap.forEach(doc => {
        const v = doc.data();
        ventasGlobales.push(v);
        tbody.innerHTML += `
          <tr class="border-b border-slate-100 hover:bg-slate-50">
            <td class="p-3 text-sm text-slate-600">${new Date(v.fecha).toLocaleString()}</td>
            <td class="p-3 text-sm">${v.metodoPago}</td>
            <td class="p-3 font-bold text-slate-800">$${parseFloat(v.total).toFixed(2)}</td>
            <td class="p-3 text-sm">${v.estado}</td>
          </tr>
        `;
      });
    });

    async function guardarProducto(e) {
      e.preventDefault();
      const p = {
        codigo: document.getElementById("prodCodigo").value.trim(),
        nombre: document.getElementById("prodNombre").value.trim(),
        categoria: document.getElementById("prodCategoria").value.trim(),
        precio: parseFloat(document.getElementById("prodPrecio").value),
        stock: parseInt(document.getElementById("prodStock").value)
      };

      await db.collection("productos").add(p);
      document.getElementById("formProducto").reset();
      alert("¡Producto registrado correctamente!");
    }

    async function marcarPagado(id) {
      await db.collection("ventas").doc(id).update({ estado: "Pagado" });
      alert("Crédito marcado como pagado.");
    }

    function exportarExcel() {
      if (ventasGlobales.length === 0) return alert("No hay ventas para exportar.");

      let csv = "Fecha,Metodo_Pago,Total,Estado,Cliente,Telefono\n";
      ventasGlobales.forEach(v => {
        csv += `"${new Date(v.fecha).toLocaleString()}","${v.metodoPago}","${v.total}","${v.estado}","${v.cliente || ''}","${v.telefono || ''}"\n`;
      });

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `Reporte_Ventas_Purificadora_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }
  </script>
</body>
</html>
