<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purificadora POS - Caja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">
  <header class="bg-teal-800 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold">💧 Punto de Venta - Purificadora</h1>
    <a href="admin.html" class="bg-teal-600 hover:bg-teal-700 text-white text-sm py-2 px-4 rounded-lg font-semibold transition">Panel Admin ⚙️</a>
  </header>

  <main class="p-6 flex-1 max-w-7xl mx-auto w-full grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Lista de Compra -->
    <section class="md:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col">
      <div class="mb-5 flex gap-3">
        <input type="text" id="barcodeInput" placeholder="Escanea o escribe código de barras..." class="flex-1 border border-slate-300 p-3 rounded-xl text-lg focus:outline-none focus:ring-2 focus:ring-teal-500 shadow-inner" autofocus>
        <button onclick="buscarProducto()" class="bg-teal-700 text-white px-6 rounded-xl font-bold hover:bg-teal-800 transition shadow">Buscar</button>
      </div>

      <div class="flex-1 overflow-y-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b text-slate-400 text-xs uppercase tracking-wider">
              <th class="p-3">Producto</th>
              <th class="p-3">Precio</th>
              <th class="p-3">Cant.</th>
              <th class="p-3">Subtotal</th>
              <th class="p-3 text-center">Acción</th>
            </tr>
          </thead>
          <tbody id="carritoBody"></tbody>
        </table>
      </div>
    </section>

    <!-- Resumen y Cobro -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between">
      <div>
        <h2 class="text-lg font-bold text-slate-700 border-b pb-3 mb-4">Resumen de Venta</h2>
        
        <div class="flex justify-between items-center text-3xl font-black mb-4">
          <span class="text-slate-500 text-lg">Total:</span>
          <span class="text-teal-700" id="totalVenta">$0.00</span>
        </div>

        <!-- Método de Pago -->
        <label class="block text-sm font-bold text-slate-600 mb-2">Método de Pago:</label>
        <select id="metodoPago" onchange="cambiarMetodoPago()" class="w-full border border-slate-300 p-3 rounded-xl mb-4 focus:ring-2 focus:ring-teal-500 outline-none">
          <option value="Efectivo">💵 Efectivo</option>
          <option value="Tarjeta">💳 Tarjeta</option>
          <option value="Credito">⏳ A Plazo / Crédito</option>
        </select>

        <!-- Bloque Pago Efectivo (Monto Pagado + Cambio + Billetes) -->
        <div id="bloqueEfectivo" class="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200 mb-4">
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">Paga con ($ MXN):</label>
            <input type="number" id="montoRecibido" oninput="calcularCambio()" placeholder="0.00" class="w-full border border-slate-300 p-2.5 rounded-lg text-lg font-bold text-slate-800 focus:ring-2 focus:ring-teal-500 outline-none">
          </div>

          <!-- Billetes Rápidos -->
          <div class="grid grid-cols-3 gap-2 pt-1">
            <button onclick="pagoRapido(20)" class="bg-white border border-slate-300 hover:bg-slate-100 font-bold py-1.5 rounded-lg text-xs text-slate-700 shadow-sm">$20</button>
            <button onclick="pagoRapido(50)" class="bg-white border border-slate-300 hover:bg-slate-100 font-bold py-1.5 rounded-lg text-xs text-slate-700 shadow-sm">$50</button>
            <button onclick="pagoRapido(100)" class="bg-white border border-slate-300 hover:bg-slate-100 font-bold py-1.5 rounded-lg text-xs text-slate-700 shadow-sm">$100</button>
            <button onclick="pagoRapido(200)" class="bg-white border border-slate-300 hover:bg-slate-100 font-bold py-1.5 rounded-lg text-xs text-slate-700 shadow-sm">$200</button>
            <button onclick="pagoRapido(500)" class="bg-white border border-slate-300 hover:bg-slate-100 font-bold py-1.5 rounded-lg text-xs text-slate-700 shadow-sm">$500</button>
            <button onclick="pagoExacto()" class="bg-teal-50 border border-teal-200 text-teal-800 hover:bg-teal-100 font-bold py-1.5 rounded-lg text-xs shadow-sm">Exacto</button>
          </div>

          <div class="flex justify-between items-center pt-2 border-t border-slate-200">
            <span class="text-sm font-bold text-slate-600">Cambio:</span>
            <span class="text-xl font-extrabold text-emerald-600" id="montoCambio">$0.00</span>
          </div>
        </div>

        <!-- Bloque Pago Crédito -->
        <div id="camposCredito" class="hidden space-y-3 bg-amber-50 p-4 rounded-xl border border-amber-200 mb-4">
          <input type="text" id="clienteNombre" placeholder="Nombre del Cliente" class="w-full border border-amber-300 p-2 rounded-lg text-sm">
          <input type="tel" id="clienteTel" placeholder="Teléfono" class="w-full border border-amber-300 p-2 rounded-lg text-sm">
          <label class="block text-xs font-bold text-amber-800">Fecha Límite de Pago:</label>
          <input type="date" id="fechaLimite" class="w-full border border-amber-300 p-2 rounded-lg text-sm">
        </div>
      </div>

      <button onclick="procesarVenta()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl text-lg shadow-md transition transform active:scale-95">
        ✅ Finalizar Venta
      </button>
    </section>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCrkP1I6pplC-Qk02QhPxSiXK-0ZkEwEkQ",
      authDomain: "purificadorapos.firebaseapp.com",
      projectId: "purificadorapos",
      storageBucket: "purificadorapos.firebasestorage.app",
      messagingSenderId: "484666109632",
      appId: "1:484666109632:web:fb6698a3e11c19f6dec725"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let carrito = [];
    const barcodeInput = document.getElementById("barcodeInput");

    // Mantener foco automático en el buscador para el escáner
    document.addEventListener("click", (e) => {
      if (e.target.tagName !== "INPUT" && e.target.tagName !== "SELECT" && e.target.tagName !== "BUTTON") {
        barcodeInput.focus();
      }
    });

    barcodeInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        buscarProducto();
      }
    });

    function cambiarMetodoPago() {
      const metodo = document.getElementById("metodoPago").value;
      document.getElementById("bloqueEfectivo").classList.toggle("hidden", metodo !== "Efectivo");
      document.getElementById("camposCredito").classList.toggle("hidden", metodo !== "Credito");
    }

    function obtenerTotalCarrito() {
      return carrito.reduce((sum, item) => sum + (item.precio * item.cant), 0);
    }

    function calcularCambio() {
      const total = obtenerTotalCarrito();
      const recibido = parseFloat(document.getElementById("montoRecibido").value) || 0;
      const cambio = recibido - total;
      document.getElementById("montoCambio").innerText = `$${(cambio > 0 ? cambio : 0).toFixed(2)}`;
    }

    function pagoRapido(monto) {
      document.getElementById("montoRecibido").value = monto;
      calcularCambio();
    }

    function pagoExacto() {
      const total = obtenerTotalCarrito();
      document.getElementById("montoRecibido").value = total.toFixed(2);
      calcularCambio();
    }

    async function buscarProducto() {
      const codigo = barcodeInput.value.trim();
      if (!codigo) return;

      const snap = await db.collection("productos").where("codigo", "==", codigo).get();
      if (snap.empty) {
        alert("Producto no encontrado");
      } else {
        const prod = { id: snap.docs[0].id, ...snap.docs[0].data() };
        const index = carrito.findIndex(i => i.id === prod.id);
        if (index > -1) {
          carrito[index].cant++;
        } else {
          carrito.push({ ...prod, cant: 1 });
        }
        renderCarrito();
      }
      barcodeInput.value = "";
      barcodeInput.focus();
    }

    function renderCarrito() {
      const tbody = document.getElementById("carritoBody");
      tbody.innerHTML = "";
      let total = 0;

      carrito.forEach((p, idx) => {
        const subtotal = p.precio * p.cant;
        total += subtotal;
        tbody.innerHTML += `
          <tr class="border-b border-slate-100 hover:bg-slate-50">
            <td class="p-3 font-semibold text-slate-700">${p.nombre}</td>
            <td class="p-3 text-slate-600">$${p.precio.toFixed(2)}</td>
            <td class="p-3 font-bold">${p.cant}</td>
            <td class="p-3 font-bold text-teal-700">$${subtotal.toFixed(2)}</td>
            <td class="p-3 text-center">
              <button onclick="eliminarItem(${idx})" class="text-rose-500 font-bold hover:text-rose-700 p-1">✕</button>
            </td>
          </tr>
        `;
      });
      document.getElementById("totalVenta").innerText = `$${total.toFixed(2)}`;
      calcularCambio();
    }

    function eliminarItem(idx) {
      carrito.splice(idx, 1);
      renderCarrito();
    }

    async function procesarVenta() {
      if (carrito.length === 0) return alert("El carrito está vacío");

      const metodo = document.getElementById("metodoPago").value;
      const total = obtenerTotalCarrito();
      const recibido = parseFloat(document.getElementById("montoRecibido").value) || 0;

      if (metodo === "Efectivo" && recibido < total) {
        return alert("El monto ingresado es menor al total de la venta.");
      }

      const venta = {
        fecha: new Date().toISOString(),
        items: carrito,
        total: total,
        metodoPago: metodo,
        pagoCon: metodo === "Efectivo" ? recibido : total,
        cambio: metodo === "Efectivo" ? Math.max(0, recibido - total) : 0,
        estado: metodo === "Credito" ? "Pendiente" : "Pagado"
      };

      if (metodo === "Credito") {
        const cliente = document.getElementById("clienteNombre").value.trim();
        const tel = document.getElementById("clienteTel").value.trim();
        const fechaLimite = document.getElementById("fechaLimite").value;

        if (!cliente || !fechaLimite) {
          return alert("Por favor ingresa el nombre del cliente y la fecha límite de pago.");
        }

        venta.cliente = cliente;
        venta.telefono = tel;
        venta.fechaLimite = fechaLimite;
      }

      await db.collection("ventas").add(venta);

      // Descontar inventario en Firestore
      for (let item of carrito) {
        const ref = db.collection("productos").doc(item.id);
        const doc = await ref.get();
        if (doc.exists) {
          const nuevoStock = Math.max(0, (doc.data().stock || 0) - item.cant);
          await ref.update({ stock: nuevoStock });
        }
      }

      alert(`¡Venta registrada con éxito!\nCambio: $${venta.cambio.toFixed(2)}`);
      carrito = [];
      document.getElementById("montoRecibido").value = "";
      renderCarrito();
      barcodeInput.focus();
    }
  </script>
</body>
</html>
