<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purificadora POS - Caja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">
  <header class="bg-teal-700 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold">💧 Purificadora - Punto de Venta</h1>
    <a href="admin.html" class="bg-teal-900 hover:bg-teal-800 text-white text-sm py-2 px-4 rounded-lg font-semibold">Ir a Admin ⚙️</a>
  </header>

  <main class="p-6 flex-1 max-w-7xl mx-auto w-full grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Lista de Compra -->
    <section class="md:col-span-2 bg-white rounded-xl shadow p-5 flex flex-col">
      <div class="mb-4 flex gap-2">
        <input type="text" id="barcodeInput" placeholder="Escanea o escribe código de barras..." class="flex-1 border p-3 rounded-lg text-lg focus:outline-teal-600 border-slate-300" autofocus>
        <button onclick="buscarProducto()" class="bg-teal-600 text-white px-5 rounded-lg font-bold hover:bg-teal-700">Buscar</button>
      </div>

      <div class="flex-1 overflow-y-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b text-slate-500 text-sm">
              <th class="p-2">Producto</th>
              <th class="p-2">Precio</th>
              <th class="p-2">Cant.</th>
              <th class="p-2">Subtotal</th>
              <th class="p-2 text-center">Acción</th>
            </tr>
          </thead>
          <tbody id="carritoBody"></tbody>
        </table>
      </div>
    </section>

    <!-- Resumen y Cobro -->
    <section class="bg-white rounded-xl shadow p-5 flex flex-col justify-between">
      <div>
        <h2 class="text-xl font-bold border-b pb-2 mb-4">Resumen de Venta</h2>
        <div class="flex justify-between items-center text-2xl font-black mb-6">
          <span>Total:</span>
          <span class="text-teal-700" id="totalVenta">$0.00</span>
        </div>

        <!-- Tipo de Pago -->
        <label class="block text-sm font-bold mb-2">Método de Pago:</label>
        <select id="metodoPago" onchange="toggleCreditoCampos()" class="w-full border p-2 rounded-lg mb-4">
          <option value="Efectivo">Contado / Efectivo</option>
          <option value="Credito">A Plazo / Crédito ⏳</option>
        </select>

        <div id="camposCredito" class="hidden space-y-3 bg-slate-50 p-3 rounded-lg border mb-4">
          <input type="text" id="clienteNombre" placeholder="Nombre del Cliente" class="w-full border p-2 rounded text-sm">
          <input type="tel" id="clienteTel" placeholder="Teléfono" class="w-full border p-2 rounded text-sm">
          <label class="block text-xs font-bold text-slate-600">Fecha Límite de Pago:</label>
          <input type="date" id="fechaLimite" class="w-full border p-2 rounded text-sm">
        </div>
      </div>

      <button onclick="procesarVenta()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl text-lg shadow-lg">
        ✅ Finalizar Venta
      </button>
    </section>
  </main>

  <script>
    // PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE REAL
    const firebaseConfig = {
      apiKey: "AIzaSyCrkP1I6pplC-Qk02QhPxSiXK-0ZkEwEkQ",
      authDomain: "purificadorapos.firebaseapp.com",
      projectId: "purificadorapos",
      storageBucket: "purificadorapos.firebasestorage.app",
      messagingSenderId: "484666109632",
      appId: "1:484666109632:web:fb6698a3e11c19f6dec725"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let carrito = [];

    // Mantener siempre el cursor listo para el scanner
    const barcodeInput = document.getElementById("barcodeInput");
    document.addEventListener("click", (e) => {
      if (e.target.tagName !== "INPUT" && e.target.tagName !== "SELECT" && e.target.tagName !== "BUTTON") {
        barcodeInput.focus();
      }
    });

    barcodeInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        buscarProducto();
      }
    });

    function toggleCreditoCampos() {
      const metodo = document.getElementById("metodoPago").value;
      document.getElementById("camposCredito").classList.toggle("hidden", metodo !== "Credito");
    }

    async function buscarProducto() {
      const codigo = barcodeInput.value.trim();
      if (!codigo) return;

      const snap = await db.collection("productos").where("codigo", "==", codigo).get();
      if (snap.empty) {
        alert("Producto no encontrado");
      } else {
        const prod = { id: snap.docs[0].id, ...snap.docs[0].data() };
        const index = carrito.findIndex(i => i.id === prod.id);
        if (index > -1) {
          carrito[index].cant++;
        } else {
          carrito.push({ ...prod, cant: 1 });
        }
        renderCarrito();
      }
      barcodeInput.value = "";
      barcodeInput.focus();
    }

    function renderCarrito() {
      const tbody = document.getElementById("carritoBody");
      tbody.innerHTML = "";
      let total = 0;

      carrito.forEach((p, idx) => {
        const subtotal = p.precio * p.cant;
        total += subtotal;
        tbody.innerHTML += `
          <tr class="border-b">
            <td class="p-2 font-semibold">${p.nombre}</td>
            <td class="p-2">$${p.precio.toFixed(2)}</td>
            <td class="p-2">${p.cant}</td>
            <td class="p-2 font-bold">$${subtotal.toFixed(2)}</td>
            <td class="p-2 text-center">
              <button onclick="eliminarItem(${idx})" class="text-red-500 font-bold hover:text-red-700">✕</button>
            </td>
          </tr>
        `;
      });
      document.getElementById("totalVenta").innerText = `$${total.toFixed(2)}`;
    }

    function eliminarItem(idx) {
      carrito.splice(idx, 1);
      renderCarrito();
    }

    async function procesarVenta() {
      if (carrito.length === 0) return alert("El carrito está vacío");

      const metodo = document.getElementById("metodoPago").value;
      const total = carrito.reduce((sum, item) => sum + (item.precio * item.cant), 0);

      const venta = {
        fecha: new Date().toISOString(),
        items: carrito,
        total: total,
        metodoPago: metodo,
        estado: metodo === "Credito" ? "Pendiente" : "Pagado"
      };

      if (metodo === "Credito") {
        const cliente = document.getElementById("clienteNombre").value.trim();
        const tel = document.getElementById("clienteTel").value.trim();
        const fechaLimite = document.getElementById("fechaLimite").value;

        if (!cliente || !fechaLimite) {
          return alert("Por favor ingresa el nombre del cliente y la fecha límite de pago.");
        }

        venta.cliente = cliente;
        venta.telefono = tel;
        venta.fechaLimite = fechaLimite;
      }

      await db.collection("ventas").add(venta);

      // Descontar inventario
      for (let item of carrito) {
        const ref = db.collection("productos").doc(item.id);
        const doc = await ref.get();
        if (doc.exists) {
          const nuevoStock = Math.max(0, (doc.data().stock || 0) - item.cant);
          await ref.update({ stock: nuevoStock });
        }
      }

      alert("Venta registrada con éxito");
      carrito = [];
      renderCarrito();
      barcodeInput.focus();
    }
  </script>
</body>
</html>
